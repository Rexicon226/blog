<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 130" xmlns="http://www.w3.org/2000/svg">
  <rect x="0.0" y="0.0" width="640.0" height="130.0" rx="10" fill="#FFFFFF" stroke="#B9C0CC" stroke-width="1.5"/>
  
      <!-- 6 mini 3x3 permutation grids -->
      <!-- perm (0,1,2) identity -->
      <g transform="translate(10,10)">
        <rect x="0" y="0" width="24" height="24" fill="#2D4FC7"/><rect x="24" y="24" width="24" height="24" fill="#2D4FC7"/><rect x="48" y="48" width="24" height="24" fill="#2D4FC7"/>
