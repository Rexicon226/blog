        <line x1="24" y1="0" x2="24" y2="72" stroke="#D7DBE2"/><line x1="48" y1="0" x2="48" y2="72" stroke="#D7DBE2"/>
        <line x1="0" y1="24" x2="72" y2="24" stroke="#D7DBE2"/><line x1="0" y1="48" x2="72" y2="48" stroke="#D7DBE2"/>
        <text x="36" y="98" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#767C89">P₁ = I</text>
      </g>
      <!-- perm (0,2,1) -->
